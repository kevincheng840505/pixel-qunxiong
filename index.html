<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2118">
<meta name="description" content="群雄誌：網頁版水墨風三國群雄策略遊戲">
<title>群雄誌</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%232b2118'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23b8322a'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23e8d9b0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 標題 -->
  <section id="screen-title" class="screen active">
    <div class="title-box">
      <canvas id="title-art" width="960" height="360"></canvas>
      <div class="title-row"><h1 class="game-title">群雄誌</h1><span class="seal title-seal">群雄<br>逐鹿</span></div>
      <p class="subtitle">群雄割據・逐鹿中原</p>
      <div class="menu">
        <button class="btn big" data-act="new">新的征程</button>
        <button class="btn" data-act="continue" id="btn-continue">繼續遊戲</button>
        <button class="btn" data-act="load">讀取存檔</button>
        <button class="btn" data-act="help">玩法說明</button>
      </div>
      <p class="tiny">v0.3 試玩版 ・ 歷史人物屬公有領域，本作數值與美術皆為原創</p>
    </div>
  </section>

  <!-- 選擇勢力 -->
  <section id="screen-select" class="screen">
    <header class="sel-head"><button class="btn small" data-act="back">返回</button><h2>西元 190 年・選擇君主</h2></header>
    <div id="faction-list" class="faction-list"></div>
  </section>

  <!-- 主遊戲 -->
  <section id="screen-game" class="screen">
    <header id="topbar">
      <div class="tb-date" id="tb-date"></div>
      <div class="tb-fac" id="tb-fac"></div>
      <div class="tb-res"><span title="金"><i class="res">金</i><b id="tb-gold"></b></span><span title="糧"><i class="res">糧</i><b id="tb-food"></b></span><span title="軍令"><i class="res">令</i><b id="tb-orders"></b></span></div>
      <button class="btn small" id="btn-menu">選單</button>
    </header>
    <div id="main">
      <div id="mapwrap">
        <canvas id="map" width="1280" height="720"></canvas>
        <div id="maplabels"></div>
        <div id="coalition-banner" class="hidden"></div>
      </div>
      <aside id="panel"></aside>
    </div>
    <nav id="bottombar">
      <button class="btn" data-act="generals">武將</button>
      <button class="btn" data-act="diplomacy">外交</button>
      <button class="btn" data-act="log">紀錄</button>
      <button class="btn red" data-act="endturn" id="btn-end">結束本季 ▶</button>
    </nav>
  </section>

  <!-- 戰鬥 -->
  <section id="screen-battle" class="screen">
    <header class="battle-head">
      <div id="bt-title"></div>
      <div id="bt-round"></div>
    </header>
    <div id="bfscroll"><div id="bfwrap">
      <canvas id="bf" width="1488" height="888"></canvas>
      <div id="bf-overlay"></div>
    </div></div>
    <div id="bt-side"><div id="bt-info"></div><div id="bt-log"></div></div>
    <div id="bt-cmds"></div>
  </section>

  <div id="modal" class="hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
